# Every push and pull request, and every release: the unit tests, and the whole addon loading on a
# stand-in game API.
name: ci

on:
  push:
  pull_request:
  # The release runs the same job before it packages (addon-release.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: luajit, for the smoke runs
        run: sudo apt-get install -y -qq luajit >/dev/null
      # The unit tests on fengari, then the whole addon on a stand-in game API (tests/run.js): the session
      # on WoW: Forever and on a retail client, each as an Alliance and a Horde character, and a made-up
      # save the size of a heavy player's on both clients. Any assert or recorded error fails it.
      - name: Unit tests and smoke runs
        working-directory: tests
        run: npm ci && npm test
