# A tag addon-v<version> (addon-v0.13.1) tests the addon, packages GoldForever/ and GoldForever_Auctions/
# with the BigWigs packager (.pkgmeta), checks the zip holds both folders, attests the zip's build provenance, and
# publishes GoldForever-<version>.zip and its SHA256SUMS: to a GitHub release always, and the zip to
# CurseForge and Wago when their project ids are in the TOC (X-Curse-Project-ID, X-Wago-ID) and their
# tokens are repository secrets (CF_API_KEY, WAGO_API_TOKEN). Without them the packager skips that site
# and says so in the log; the release on GitHub still happens.
#
# The packager reads WoW: Forever from the TOC's interface 16001 and retail from GoldForever_Mainline.toc,
# so one file is uploaded for both (design: delivery 008, D-008.1).
name: addon release

on:
  push:
    tags: ["addon-v*"]

permissions:
  contents: read

jobs:
  # The same gate as every push (ci.yml).
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version and destinations
        id: plan
        env:
          HAS_CF_TOKEN: ${{ secrets.CF_API_KEY != '' }}
          HAS_WAGO_TOKEN: ${{ secrets.WAGO_API_TOKEN != '' }}
        run: |
          version="${GITHUB_REF_NAME#addon-v}"
          # The version is in each addon's three TOCs and in Kernel/Core.lua: each must say the tag's.
          for toc in GoldForever/GoldForever{,_Mainline,_Forever}.toc GoldForever_Auctions/GoldForever_Auctions{,_Mainline,_Forever}.toc; do
            toc_version=$(sed -n 's/^## Version: *//p' "$toc" | tr -d '\r')
            if [[ "$version" != "$toc_version" ]]; then
              echo "::error::the tag says $version but $toc says $toc_version"
              exit 1
            fi
          done
          core_version=$(sed -n 's/^local VERSION = "\(.*\)"/\1/p' GoldForever/Kernel/Core.lua | tr -d '\r')
          if [[ "$version" != "$core_version" ]]; then
            echo "::error::the tag says $version but Core.lua says $core_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cf_id=$(sed -n 's/^## X-Curse-Project-ID: *//p' GoldForever/GoldForever.toc | tr -d '\r')
          wago_id=$(sed -n 's/^## X-Wago-ID: *//p' GoldForever/GoldForever.toc | tr -d '\r')
          if [[ -n "$cf_id" && "$HAS_CF_TOKEN" == true ]]; then
            echo "CurseForge: uploading to project $cf_id"
          else
            echo "CurseForge: SKIPPED (project id in the TOC: ${cf_id:-none}, CF_API_KEY set: $HAS_CF_TOKEN)"
          fi
          if [[ -n "$wago_id" && "$HAS_WAGO_TOKEN" == true ]]; then
            echo "Wago: uploading to project $wago_id"
          else
            echo "Wago: SKIPPED (project id in the TOC: ${wago_id:-none}, WAGO_API_TOKEN set: $HAS_WAGO_TOKEN)"
          fi
      # A build without uploading, so a zip that lacks an addon folder stops the release before anything is
      # published. The packager uploads only a zip it built in the same run, so the next step builds it again
      # from the same tree and .pkgmeta.
      - uses: BigWigsMods/packager@v2
        with:
          args: -d -n "{package-name}-${{ steps.plan.outputs.version }}:${{ steps.plan.outputs.version }}"
          pandoc: "false"
      - name: The zip holds GoldForever/ and GoldForever_Auctions/
        env:
          ZIP: .release/GoldForever-${{ steps.plan.outputs.version }}.zip
        run: |
          entries=$(unzip -Z1 "$ZIP")
          echo "Entries per top-level folder of $ZIP:"
          cut -d/ -f1 <<< "$entries" | sort | uniq -c
          for folder in GoldForever GoldForever_Auctions; do
            if ! grep -qx "$folder/$folder.toc" <<< "$entries"; then
              echo "::error::$ZIP has no $folder/$folder.toc: the game would not load $folder (.pkgmeta move-folders)"
              exit 1
            fi
          done
      - uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-${{ steps.plan.outputs.version }}:${{ steps.plan.outputs.version }}"
          pandoc: "false"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # Who built the zip, from which commit, with which workflow: `gh attestation verify
      # GoldForever-<version>.zip --repo gold-forever/addon` checks it.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: .release/GoldForever-${{ steps.plan.outputs.version }}.zip
      # The companion checks a download against this file, without GitHub's API digest field.
      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: GoldForever-${{ steps.plan.outputs.version }}.zip
        run: |
          cd .release
          sha256sum -- "$ZIP_NAME" | tee SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY"
